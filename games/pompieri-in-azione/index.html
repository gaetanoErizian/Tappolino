<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8fd3ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Pompieri in Azione</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #8fd3ff;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
      -webkit-tap-highlight-color: transparent; font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); background: #8fd3ff; }
    #game { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    #game canvas { display: block; }
    #footer { flex: 0 0 auto; height: var(--footer-h, 0px); position: relative; overflow: hidden; background: #2b2140; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #8fd3ff; align-items: center; justify-content: center; }
    #rotate svg { width: 40vmin; height: 40vmin; animation: rot 2s ease-in-out infinite; }
    @keyframes rot { 0%,30% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }
    /* Solo browser: in app l'orientamento è bloccato dal sistema */
    @media (orientation: portrait) { body.web #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <div id="footer"></div>
  </div>
  <div id="overlay"></div>
  <div id="rotate" aria-hidden="true">
    <svg viewBox="0 0 100 100"><rect x="30" y="12" width="40" height="76" rx="8" fill="#fff" stroke="#2b2140" stroke-width="5"/><circle cx="50" cy="78" r="4" fill="#2b2140"/></svg>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
