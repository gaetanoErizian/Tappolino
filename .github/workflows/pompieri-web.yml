name: Pompieri — test e build web

on:
  push:
    branches: [main, "game/pompieri-in-azione"]
    paths: ["games/pompieri-in-azione/**"]
  pull_request:
    paths: ["games/pompieri-in-azione/**"]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/pompieri-in-azione
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/pompieri-in-azione/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: games/pompieri-in-azione/dist
