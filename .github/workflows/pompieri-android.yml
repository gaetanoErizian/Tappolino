name: Pompieri — Android (AAB firmato)

# Avvio manuale da GitHub (Actions → Pompieri — Android → Run workflow) oppure con un tag pompieri-v1.0.0
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Traccia Google Play (internal | production | none = solo file AAB)"
        required: true
        default: internal
  push:
    tags: ["pompieri-v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/pompieri-in-azione
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/pompieri-in-azione/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Keystore di firma (dai segreti)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build AAB release
        working-directory: games/pompieri-in-azione/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: games/pompieri-in-azione/android/app/build/outputs/bundle/release/app-release.aab

      - name: Caricamento su Google Play
        if: env.PLAY_JSON != '' && (github.event_name == 'push' || inputs.track != 'none')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.tappolino.pompieri
          releaseFiles: games/pompieri-in-azione/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ (inputs.track || 'internal') == 'production' && 'draft' || 'completed' }}
