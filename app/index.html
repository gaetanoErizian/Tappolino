<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8fd3ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Tappolino</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #8fd3ff;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
      -webkit-tap-highlight-color: transparent; font-family: "Fredoka", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; box-sizing: border-box;
      /* Il gioco riempie tutto lo schermo, anche accanto alla fotocamera: niente fasce vuote ai lati.
         I pulsanti negli angoli si tengono lontani dalla fotocamera da soli (core/ui.ts, pin). */
      padding: env(safe-area-inset-top) 0 0 0; background: #8fd3ff; }
    #game { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    #game canvas { display: block; }
    #footer { flex: 0 0 auto; height: var(--footer-h, 0px); position: relative; overflow: hidden; background: #2b2140; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #8fd3ff; align-items: center; justify-content: center; }
    #rotate svg { width: 40vmin; height: 40vmin; animation: rot 2s ease-in-out infinite; }
    @keyframes rot { 0%,30% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }
    /* Solo browser: in app l'orientamento è bloccato dal sistema */
    @media (orientation: portrait) { body.web #rotate { display: flex; } }
    /* ---- Loader Tappolino (core/loader.ts): visibile dal primo istante ---- */
    #tp-loader { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; --p: 0;
      background: linear-gradient(#4fb3f2, #d4f0ff); opacity: 1; transition: opacity .3s ease; animation: tplin .18s ease-out;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #tp-loader[hidden] { display: none; }
    #tp-loader.tpl-out { opacity: 0; }
    @keyframes tplin { from { opacity: 0; } to { opacity: 1; } }
    .tpl-box { display: flex; flex-direction: column; align-items: center; width: min(72vw, 600px); }
    .tpl-word { width: min(100%, 92vh); }
    .tpl-word svg { display: block; width: 100%; height: auto; animation: tplfloat 2.6s ease-in-out infinite; }
    @keyframes tplfloat { 0%, 100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-2.2%) rotate(.6deg); } }
    .tpl-track { position: relative; width: 100%; height: clamp(22px, 6.4vh, 34px); margin-top: clamp(56px, 20vh, 112px); }
    .tpl-bar { position: absolute; inset: 0; border-radius: 999px; background: #fff; border: 4px solid #2b2140; overflow: hidden;
      box-shadow: 0 6px 0 #2b2140, 0 14px 18px rgba(29, 36, 64, .22); }
    /* La sfumatura è larga quanto l'intera barra: i colori si scoprono man mano che avanza. */
    .tpl-fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p) * 100%); overflow: hidden; transition: width .35s cubic-bezier(.3, .8, .4, 1);
      background: linear-gradient(90deg, #ff5a5f, #ff9f1c 17%, #ffc800 34%, #35c46a 51%, #36a9f0 68%, #8a5cf6 84%, #ff5e9a) 0 0 / calc(100% / max(var(--p), .001)) 100% no-repeat; }
    .tpl-fill::before { content: ''; position: absolute; inset: 0 -60px; animation: tplflow .7s linear infinite;
      background: repeating-linear-gradient(115deg, rgba(255, 255, 255, .3) 0 14px, rgba(255, 255, 255, 0) 14px 28px); }
    .tpl-fill::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 46%; background: linear-gradient(rgba(255, 255, 255, .6), rgba(255, 255, 255, .1)); }
    @keyframes tplflow { to { transform: translateX(31px); } }
    .tpl-tappo { position: absolute; bottom: 34%; left: calc(var(--p) * 100%); width: clamp(60px, 19vh, 104px); transform: translateX(-50%);
      transition: left .35s cubic-bezier(.3, .8, .4, 1); pointer-events: none; }
    .tpl-tappo svg { display: block; width: 100%; height: auto; transform-origin: 50% 90%; animation: tplhop .34s ease-in-out infinite alternate; }
    @keyframes tplhop { from { transform: translateY(0) rotate(-4deg) scale(1.03, .97); } to { transform: translateY(-11%) rotate(4deg) scale(.98, 1.03); } }
    .tpl-done .tpl-tappo svg { animation: tpljump .42s ease-out forwards; }
    @keyframes tpljump { 0% { transform: translateY(0) scale(1.1, .9); } 45% { transform: translateY(-38%) scale(.94, 1.08) rotate(8deg); } 100% { transform: translateY(0) scale(1); } }
    .tpl-sparks { position: absolute; right: -6px; top: 50%; width: 0; height: 0; pointer-events: none; }
    .tpl-sparks i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; opacity: 0; background: #ffd23f;
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
    .tpl-done .tpl-sparks i { animation: tplspark .42s ease-out forwards; }
    .tpl-sparks i:nth-child(1) { --dx: -46px; --dy: -58px; }
    .tpl-sparks i:nth-child(2) { --dx: 34px; --dy: -64px; background: #ff5e9a; }
    .tpl-sparks i:nth-child(3) { --dx: 58px; --dy: -14px; background: #36a9f0; }
    .tpl-sparks i:nth-child(4) { --dx: -66px; --dy: -8px; background: #35c46a; }
    @keyframes tplspark { 0% { opacity: 1; transform: translate(0, 0) scale(.3); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(60deg); } }
    .tpl-failed .tpl-fill { filter: grayscale(1) brightness(1.1); }
    .tpl-failed .tpl-fill::before, .tpl-failed .tpl-tappo svg { animation: none; }
    .tpl-failed .tpl-tappo svg { transform: rotate(-14deg); }
    .tpl-retry { display: none; margin-top: clamp(14px, 5vh, 30px); width: 72px; height: 72px; border-radius: 50%; border: 4px solid #2b2140; background: #ffd23f;
      box-shadow: 0 6px 0 #2b2140; cursor: pointer; align-items: center; justify-content: center; padding: 0; }
    .tpl-retry:active { transform: translateY(5px); box-shadow: 0 1px 0 #2b2140; }
    .tpl-retry svg { width: 40px; height: 40px; }
    .tpl-failed .tpl-retry { display: flex; }
    @media (prefers-reduced-motion: reduce) { .tpl-word svg, .tpl-tappo svg, .tpl-fill::before { animation: none; } }
  </style>
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <div id="footer"></div>
  </div>
  <div id="overlay"></div>
  <div id="rotate" aria-hidden="true">
    <svg viewBox="0 0 100 100"><rect x="30" y="12" width="40" height="76" rx="8" fill="#fff" stroke="#2b2140" stroke-width="5"/><circle cx="50" cy="78" r="4" fill="#2b2140"/></svg>
  </div>
  <div id="tp-loader" class="tpl-in" role="progressbar" aria-label="Tappolino" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="tpl-box">
      <div class="tpl-word"><!--brand:wordmark--></div>
      <div class="tpl-track">
        <div class="tpl-bar"><div class="tpl-fill"></div></div>
        <div class="tpl-tappo"><!--brand:mark--></div>
        <div class="tpl-sparks"><i></i><i></i><i></i><i></i></div>
      </div>
      <button class="tpl-retry" type="button" aria-label="Riprova">
        <svg viewBox="0 0 48 48"><path d="M38 24a14 14 0 1 1-4.6-10.4" fill="none" stroke="#2b2140" stroke-width="6" stroke-linecap="round"/><path d="M36 4v12H24z" fill="#2b2140"/></svg>
      </button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
